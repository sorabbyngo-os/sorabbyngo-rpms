# Sorabbyngo OS repository identity
# Canonical source: Sorabbyngo OS release metadata

ID=sorabbyngo
NAME="Sorabbyngo OS"
PRETTY_NAME="Sorabbyngo OS"

# Release identity is supplied by the installed Sorabbyngo OS.
# Do not derive it from the build host.
RELEASE_SOURCE=/etc/os-release
RELEASE_VERSION_KEY=VERSION_ID

# RPM package ecosystem
PACKAGE_ECOSYSTEM=rpm

# Official Sorabbyngo package repository
REPOSITORY_URL=https://repo.sorabbyngo.org/rpm

# Repository channels
DEFAULT_CHANNEL=stable
SUPPORTED_CHANNELS=stable,testing

# DNF release variable supplied by the Sorabbyngo OS base system
DNF_RELEASE_VARIABLE=/etc/dnf/vars/sorabbyngo_releasever
DNF_RELEASE_VARIABLE_NAME=sorabbyngo_releasever

# Repository path template
REPOSITORY_PATH_TEMPLATE={base}/{channel}/releases/{release}/{architecture}/
